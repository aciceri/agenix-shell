name: Nix Flake actions

on:
  pull_request:
  push:
      branches:
      - master

jobs:
  nix-matrix:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v30
      - id: set-matrix
        name: Generate Nix Matrix
        run: |
          set -Eeu
          matrix="$(nix eval --json '.#githubActions.matrix')"
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

  nix-build:
    name: ${{ matrix.name }} (${{ matrix.system }})
    needs: nix-matrix
    runs-on: ${{ matrix.os }}
    strategy:
      matrix: ${{fromJSON(needs.nix-matrix.outputs.matrix)}}
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v30
      - run: |
         # Otherwise bubblewrap used in flake checks may fail
         sudo sysctl -w kernel.apparmor_restrict_unprivileged_unconfined=0
         sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - run: nix build -L '.#${{ matrix.attr }}'

  build-flake-parts-website:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v30
      # TODO: drop this step and the `--override-input gitlab-ci` flag below once
      # flake.parts-website stops depending on gitlab.horizon-haskell.net, which no
      # longer serves the repo (cannot be fetched, no mirror exists).
      # See https://github.com/hercules-ci/flake.parts-website/issues/2026
      # The stub needs at least one option, otherwise the docs renderer errors out.
      - name: Create gitlab-ci stub
        run: |
          mkdir -p "$RUNNER_TEMP/gitlab-ci-stub"
          cd "$RUNNER_TEMP/gitlab-ci-stub"
          echo '{ outputs = _: { flakeModule = ./module.nix; }; }' > flake.nix
          echo '{ lib, ... }: { options.gitlab-ci-stub = lib.mkOption { type = lib.types.bool; default = false; description = "Placeholder."; }; }' > module.nix
      - run: nix build --extra-experimental-features "pipe-operators" -L github:hercules-ci/flake.parts-website#checks.x86_64-linux.linkcheck --override-input agenix-shell . --override-input gitlab-ci "path:$RUNNER_TEMP/gitlab-ci-stub"
